name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Create Discord Embed
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.WEBHOOK }}
          embed-title: ${{ github.event.release.name }}
          embed-url: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/Whisky.zip
          embed-description: ${{ github.event.release.body }}
          embed-color: 9442302

      # The Homebrew cask bump is disabled. The `whisky` cask belongs to
      # Whisky-App. This fork has no cask of its own. Re-enable this step
      # when the fork has its own release channel.
      # - name: Update Homebrew Cask
      #   uses: macauley/action-homebrew-bump-cask@v1
      #   with:
      #     token: ${{secrets.BREW_TOKEN}}
      #     org: Whisky-App
      #     cask: whisky
