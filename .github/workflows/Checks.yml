name: Checks

# BuildWine takes 60-90 minutes. Almost everything that actually breaks between
# builds is cheap to catch: a patch that no longer applies against the CrossOver
# tree, a shell script that does not parse, a probe that does not compile.
# The `checks` job runs on every push and reports in about two minutes.
#
# The `probes` job is the one that runs a probe against a real bundle. It is
# slower and needs macOS, so it is a separate job and does not delay `checks`.

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CROSSOVER_VERSION: "26.1.0"
  # SHA256 of crossover-sources-${CROSSOVER_VERSION}.tar.gz. Move both together.
  # Scripts/build-wine.sh carries the same pin.
  CROSSOVER_SHA256: "e4ec87d5821a009dd1f1d2e36ffe2e24b8fcbae9516375ea42f95a16928ab8fa"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Shell scripts parse
        run: |
          fail=0
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; fail=1; }
          done
          exit $fail

      - name: Install mingw
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64

      - name: Probes compile
        # One link line for every probe. mingw import libraries only pull in the
        # symbols a probe references, so listing them all costs nothing and
        # stops a new probe from failing here because it needs -lgdi32.
        run: |
          fail=0
          for f in $(git ls-files 'Scripts/*.c'); do
            echo "--- $f"
            x86_64-w64-mingw32-gcc -O1 -Wall -o /tmp/$(basename "$f" .c).exe "$f" \
              -lntdll -ld3d11 -ld3d12 -ld3d9 -ldxgi -luuid -lgdi32 2>/tmp/err.txt \
              || { echo "::error file=$f::failed to compile"; cat /tmp/err.txt; fail=1; }
          done
          exit $fail

      - name: Cache CrossOver source
        id: cxsrc
        uses: actions/cache@v4
        with:
          path: /tmp/cxsrc.tar.gz
          key: cxsrc-${{ env.CROSSOVER_VERSION }}

      - name: Fetch CrossOver source
        if: steps.cxsrc.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 --max-time 900 -o /tmp/cxsrc.tar.gz \
            "https://media.codeweavers.com/pub/crossover/source/crossover-sources-${CROSSOVER_VERSION}.tar.gz"

      - name: CrossOver source checksum
        # Not gated on the cache, so a swapped release artifact and a poisoned
        # cache entry both fail here instead of extracting.
        run: echo "$CROSSOVER_SHA256  /tmp/cxsrc.tar.gz" | sha256sum -c -

      - name: Patches apply cleanly
        run: |
          mkdir -p /tmp/tree && tar xzf /tmp/cxsrc.tar.gz -C /tmp/tree
          src=/tmp/tree/sources/wine
          [ -d "$src" ] || src=$(find /tmp/tree -maxdepth 3 -type d -name wine | head -1)
          echo "wine source at $src"
          fail=0
          for p in Scripts/patches/*.patch; do
            echo "--- $p"
            if ( cd "$src" && patch -p1 --dry-run --silent --force -R < "$GITHUB_WORKSPACE/$p" ) >/dev/null 2>&1; then
              echo "    already present in this tree"
            elif ( cd "$src" && patch -p1 --dry-run --force < "$GITHUB_WORKSPACE/$p" ); then
              echo "    applies"
            else
              echo "::error file=$p::does not apply to CrossOver ${CROSSOVER_VERSION} and is not already present"
              fail=1
            fi
          done
          exit $fail

      - name: Patched ntdll still compiles
        # The syscall-argument patch is the one that matters and the one most
        # likely to rot. Applying it and compiling the single translation unit
        # standalone is not a substitute for BuildWine, but it catches a syntax
        # error or a bad hunk in seconds instead of an hour.
        run: |
          src=/tmp/tree/sources/wine
          [ -d "$src" ] || src=$(find /tmp/tree -maxdepth 3 -type d -name wine | head -1)
          cd "$src"
          patch -p1 --force --forward < "$GITHUB_WORKSPACE/Scripts/patches/ntdll-boolean-syscall-arg-abi.patch"
          gcc -fsyntax-only -xc - <<'EOF'
          typedef unsigned char BOOLEAN;
          static inline int syscall_bool_arg( BOOLEAN value )
          {
              return *(volatile unsigned char *)&value != 0;
          }
          int main(void){ BOOLEAN b = 0; return syscall_bool_arg(b); }
          EOF
          grep -q 'syscall_bool_arg( restart )' dlls/ntdll/unix/sync.c \
            && grep -q 'syscall_bool_arg( single_entry )' dlls/ntdll/unix/sync.c \
            && echo "patch landed both call sites"

  probes:
    # Compiling a probe does not exercise the bug the probe exists to catch.
    # The BOOLEAN syscall-argument regression lives in ntdll, so it only shows
    # up when dosdev-probe RUNS against a real bundle. That run is
    # deterministic and takes 15 seconds. So download the published bundle,
    # install it with the same script a person uses, and run both probes.
    #
    # This job asserts the exit code the pinned bundle is known to produce
    # rather than assuming a pass. That way it tests the probe, not the bundle:
    # a probe that stopped detecting the bug turns this red.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      BUNDLE_REPO: EricSpencer00/Whisky
      BUNDLE_TAG: wine-v26.1.0-foss-phase1l
      # SHA256 of Libraries.tar.gz for BUNDLE_TAG. Move both together.
      BUNDLE_SHA256: "645917a4135c2ce83047186b6a352bf0d03ff785468e0c276db800ae044ab634"
      # What run-dosdev-probe.sh must exit with for BUNDLE_TAG. 0 = enumeration
      # advances, 2 = hung. wine-v26.1.0-foss-phase1l predates the ntdll
      # syscall-argument fix, so 2 is the right answer for it — the probe
      # hanging there is the probe working. Set this to 0 when BUNDLE_TAG moves
      # to a bundle built with the patch.
      EXPECT_DOSDEV_RC: "2"
      # A fresh directory, so install-bundle.sh always makes $BOTTLES/probe
      # instead of reusing a bottle that happens to be there.
      BOTTLES: /tmp/ci-bottles

    steps:
      - uses: actions/checkout@v5

      - name: Pin the bundle paths
        # install-bundle.sh exports WHISKY_LIBS, but that export dies with the
        # step. Without this the probe steps fall back to the default path and
        # measure whatever Wine is installed there, not the bundle under test.
        run: |
          LIB="$HOME/Library/Application Support/com.isaacmarovitz.Whisky/Libraries"
          echo "LIB=$LIB" >> "$GITHUB_ENV"
          echo "WHISKY_LIBS=$LIB/Wine" >> "$GITHUB_ENV"

      - name: Install mingw
        run: brew install mingw-w64

      - name: Cache Wine bundle
        id: bundle
        uses: actions/cache@v4
        with:
          path: ~/bundle/Libraries.tar.gz
          key: wine-bundle-${{ env.BUNDLE_TAG }}

      - name: Download Wine bundle
        if: steps.bundle.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/bundle
          curl -fL --retry 3 --max-time 900 -o ~/bundle/Libraries.tar.gz \
            "https://github.com/$BUNDLE_REPO/releases/download/$BUNDLE_TAG/Libraries.tar.gz"

      - name: Wine bundle checksum
        # Not gated on the cache. The probe steps assert an exit code that only
        # means something for this exact bundle, so verify it is that bundle.
        run: echo "$BUNDLE_SHA256  $HOME/bundle/Libraries.tar.gz" | shasum -a 256 -c -

      - name: Install bundle and make a bottle
        # --no-verify installs and boots a bottle but leaves the probes to us,
        # so the two steps below can assert their own result.
        run: ./Scripts/install-bundle.sh --no-verify ~/bundle/Libraries.tar.gz

      - name: dosdev probe runs
        run: |
          rc=0
          ./Scripts/run-dosdev-probe.sh "$BOTTLES/probe" || rc=$?
          echo "run-dosdev-probe.sh exit $rc (expected $EXPECT_DOSDEV_RC)"
          [ "$rc" = "$EXPECT_DOSDEV_RC" ] || {
            echo "::error::dosdev probe exit $rc, expected $EXPECT_DOSDEV_RC for $BUNDLE_TAG"
            exit 1
          }

      - name: d3d11 probe runs
        # Prints the feature level the bundle exposes. run-d3d11-probe.sh only
        # fails when the probe produces no result at all, so a level below 11_1
        # is reported, not treated as a failure.
        env:
          WINEPREFIX: ${{ env.BOTTLES }}/probe
        run: ./Scripts/run-d3d11-probe.sh probe
